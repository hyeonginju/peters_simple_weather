name: Poll weather alerts

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend alert poll
        run: |
          curl --fail-with-body --max-time 60 -X POST \
            -H "x-poll-secret: ${{ secrets.POLL_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/internal/poll-alerts"
