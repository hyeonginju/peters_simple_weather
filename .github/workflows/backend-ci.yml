name: Backend CI

on:
  pull_request:
    branches: [main]
    paths: ['backend/**']
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
